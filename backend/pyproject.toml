[project]
name = "livestock-geoportal-backend"
version = "0.1.0"
description = "Livestock Value Chain Geoportal — Django API"
requires-python = ">=3.12"
license = { text = "Owned by UN ECA — licence TBD at handover" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["S105"]
"apps/ingest/cache.py" = ["S310"]  # https-only enforced in _request()

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
